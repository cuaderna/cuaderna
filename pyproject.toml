[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuaderna"
version = "0.0.1"
description = "Durable, replayable execution engine for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Maximiliano Zeballos" }]
keywords = ["agents", "durable-execution", "replay", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cuaderna/cuaderna"
Issues = "https://github.com/cuaderna/cuaderna/issues"
