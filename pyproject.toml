[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuaderna"
version = "0.0.2"
description = "Durable, replayable execution engine for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Maximiliano Zeballos" }]
keywords = ["agents", "durable-execution", "replay", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
]

[project.urls]
Repository = "https://github.com/cuaderna/cuaderna"
Issues = "https://github.com/cuaderna/cuaderna/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
