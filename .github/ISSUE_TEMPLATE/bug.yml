name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a journal or a run file that holds secrets or local paths. Step arguments and results are stored in plain text, so check anything you attach first. Security problems go to a private report, see SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: cuaderna version, Python version and platform
      description: For example, cuaderna 0.2.0, Python 3.12, Windows 11.
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: What did you run
      description: The code or command, as short as it can be and still show the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
