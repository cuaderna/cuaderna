name: Proposal
description: Suggest a change or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
      description: Describe the situation and what you need, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it
      description: A sketch of the API or behavior, if you have one.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead
    validations:
      required: false
