name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uv publish
